<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Shopping Pokhara</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1a2f;
  color: white;
}

/* HEADER */
header {
  background: linear-gradient(90deg, #ff6a00, #ff3c00);
  padding: 15px;
  text-align: center;
}

/* NAV */
nav {
  text-align: center;
  padding: 10px;
}

nav button {
  margin: 5px;
  padding: 10px;
  background: #1e90ff;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 5px;
}

/* LAYOUT */
.container {
  display: flex;
}

/* PRODUCTS */
#products {
  width: 70%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  padding: 15px;
}

.product {
  background: white;
  color: black;
  padding: 10px;
  border-radius: 10px;
}

.product img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

/* CART */
#cart {
  width: 30%;
  background: #111;
  padding: 10px;
}

button {
  cursor: pointer;
}

.payment {
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  <h1>Online Shopping Pokhara</h1>
</header>

<nav>
  <button onclick="filterCategory('all')">All</button>
  <button onclick="filterCategory('snacks')">Snacks</button>
  <button onclick="filterCategory('stationary')">Stationary</button>
  <button onclick="filterCategory('electronics')">Electronics</button>
  <button onclick="filterCategory('chocolate')">Chocolate</button>
  <button onclick="filterCategory('food')">Food</button>
  <button onclick="filterCategory('meat')">Meat</button>
  <button onclick="filterCategory('vegetables')">Vegetables</button>
  <button onclick="filterCategory('drink')">Drink</button>
  <button onclick="filterCategory('gas')">Gas</button>
</nav>

<div class="container">

<!-- PRODUCTS -->
<div id="products"></div>

<!-- CART -->
<div id="cart">
  <h2>🛒 Cart</h2>
  <div id="cartItems"></div>
  <h3>Total: Rs. <span id="total">0</span></h3>

  <div class="payment">
    <select id="payment">
      <option>Cash on Delivery</option>
      <option>eSewa</option>
    </select>
    <br><br>
    <button onclick="checkout()">Checkout</button>
  </div>
</div>

</div>

<!-- MAP -->
<h2 style="text-align:center;">📍 Delivery Area: Pokhara</h2>
<center>
<iframe src="https://maps.google.com/maps?q=pokhara&t=&z=13&ie=UTF8&iwloc=&output=embed"
width="90%" height="300"></iframe>
</center>

<script>
// SAMPLE PRODUCTS (later from Firebase)
let products = [
  {name:"Chips", price:50, category:"snacks", image:"https://via.placeholder.com/150"},
  {name:"Pen", price:20, category:"stationary", image:"https://via.placeholder.com/150"},
  {name:"TV", price:30000, category:"electronics", image:"https://via.placeholder.com/150"},
  {name:"Chocolate", price:100, category:"chocolate", image:"https://via.placeholder.com/150"},
  {name:"Rice", price:1500, category:"food", image:"https://via.placeholder.com/150"},
  {name:"Chicken", price:500, category:"meat", image:"https://via.placeholder.com/150"},
  {name:"Tomato", price:60, category:"vegetables", image:"https://via.placeholder.com/150"},
  {name:"Coke", price:80, category:"drink", image:"https://via.placeholder.com/150"},
  {name:"Gas Cylinder", price:1800, category:"gas", image:"https://via.placeholder.com/150"}
];

let cart = [];
let total = 0;

// DISPLAY PRODUCTS
function displayProducts(list){
  let container = document.getElementById("products");
  container.innerHTML = "";

  list.forEach(p=>{
    container.innerHTML += `
      <div class="product">
        <img src="${p.image}">
        <h3>${p.name}</h3>
        <p>Rs. ${p.price}</p>
        <button onclick="addToCart('${p.name}', ${p.price})">Add</button>
      </div>
    `;
  });
}

// FILTER CATEGORY
function filterCategory(cat){
  if(cat === "all"){
    displayProducts(products);
  } else {
    let filtered = products.filter(p => p.category === cat);
    displayProducts(filtered);
  }
}

// CART
function addToCart(name, price){
  cart.push({name, price});
  total += price;
  updateCart();
}

function updateCart(){
  let div = document.getElementById("cartItems");
  div.innerHTML = "";

  cart.forEach(item=>{
    div.innerHTML += `<p>${item.name} - Rs. ${item.price}</p>`;
  });

  document.getElementById("total").innerText = total;
}

// CHECKOUT
function checkout(){
  if(cart.length === 0){
    alert("Cart is empty!");
    return;
  }

  let payment = document.getElementById("payment").value;

  alert("Order placed!\nPayment: " + payment + "\nTotal: Rs. " + total);

  cart = [];
  total = 0;
  updateCart();
}

// LOAD
displayProducts(products);
</script>

</body>
</html>
